[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-bridge"
version = "0.1.0"
description = "Agent-friendly GDB debugging interface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.27.0",
    "pexpect>=4.9.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.scripts]
gdb-bridge = "gdb_bridge.main:main"
gdb-bridge-mcp = "gdb_bridge.mcp.server:main"

[tool.mypy]
plugins = ["pydantic.mypy"]
follow_imports = "skip"
exclude = ["tests/", "poc/"]
