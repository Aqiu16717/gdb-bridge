version: '3.8'

services:
  gdb-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: gdb-bridge:latest
    container_name: gdb-bridge
    ports:
      - "8080:8080"       # REST API
      - "2345:2345"       # gdbserver remote
      - "2346:2346"       # lldb-server remote
    environment:
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600}
      - API_KEY=${API_KEY:-}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-10}
      - COREDUMP_PATH=${COREDUMP_PATH:-/tmp/cores}
    volumes:
      - ./debug-targets:/debug-targets:ro
      - ./tests/fixtures/core_dump:/core-dumps:ro
      - /tmp/gdb-sessions
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis for distributed sessions (enable when needed)
